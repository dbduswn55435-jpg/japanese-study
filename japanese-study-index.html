<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>일본어 공부</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --accent: #8b7cf6;
      --accent-soft: rgba(139,124,246,.14);
      --accent-light: rgba(139,124,246,.07);

      --bg: #f7f7fb;
      --card: #ffffff;
      --text: #25252d;
      --subtext: #777783;
      --border: #e8e8ef;
      --danger: #e45d68;

      --radius-big: 25px;
      --radius: 17px;

      --shadow:
        0 8px 28px rgba(0,0,0,.06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================
       로그인
    ========================================= */

    #authScreen {
      min-height: 100vh;
      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: min(430px, 100%);
      background: white;
      border-radius: 30px;
      padding: 34px 24px;
      box-shadow: var(--shadow);
    }

    .auth-logo {
      width: 68px;
      height: 68px;

      border-radius: 23px;

      background: var(--accent-soft);
      color: var(--accent);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 26px;
      font-weight: 900;

      margin-bottom: 19px;
    }

    .auth-card h1 {
      margin: 0;
      font-size: 28px;
    }

    .auth-desc {
      margin: 10px 0 27px;

      color: var(--subtext);
      font-size: 14px;
      line-height: 1.65;
    }

    .auth-field {
      margin-bottom: 13px;
    }

    .auth-field label {
      display: block;

      margin: 0 0 7px 3px;

      font-size: 13px;
      font-weight: 800;
    }

    .auth-field input {
      width: 100%;

      padding: 15px 16px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: #fafafd;

      outline: none;

      font-size: 16px;
    }

    .auth-field input:focus {
      background: white;
      border-color: var(--accent);
    }

    .main-auth-button {
      width: 100%;

      margin-top: 6px;
      padding: 15px;

      border: 0;
      border-radius: 16px;

      background: var(--accent);
      color: white;

      font-size: 16px;
      font-weight: 850;
    }

    .main-auth-button:disabled {
      opacity: .55;
    }

    .switch-auth {
      margin-top: 19px;

      text-align: center;
      color: var(--subtext);
      font-size: 14px;
    }

    .switch-auth button {
      border: 0;
      background: transparent;

      color: var(--accent);
      font-weight: 850;
    }

    #authMessage {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;
      font-size: 13px;
      line-height: 1.55;
    }


    /* =========================================
       앱 헤더
    ========================================= */

    #app {
      min-height: 100vh;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;

      padding:
        max(13px, env(safe-area-inset-top))
        18px
        10px;

      background: rgba(247,247,251,.93);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border-bottom:
        1px solid rgba(0,0,0,.035);
    }

    .header-row {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .app-title {
      flex: 1;

      font-size: 19px;
      font-weight: 900;
    }

    .round-button {
      min-width: 42px;
      height: 42px;

      border: 0;
      border-radius: 14px;

      background: white;

      box-shadow:
        0 3px 12px rgba(0,0,0,.05);
    }

    .main-tabs {
      max-width: 1200px;
      margin: 13px auto 0;

      display: flex;
      gap: 8px;
    }

    .main-tab {
      flex: 1;

      padding: 11px 15px;

      border: 0;
      border-radius: 15px;

      background: #eeeeF4;
      color: var(--subtext);

      font-weight: 850;
    }

    .main-tab.active {
      background: var(--accent);
      color: white;
    }


    /* =========================================
       공통 페이지
    ========================================= */

    .page {
      max-width: 1200px;

      margin: auto;
      padding: 18px;
    }


    /* =========================================
       파일 탭
    ========================================= */

    .document-toolbar {
      display: flex;
      gap: 9px;

      overflow-x: auto;

      padding-bottom: 7px;

      scrollbar-width: none;
    }

    .document-toolbar::-webkit-scrollbar {
      display: none;
    }

    #documentTabs {
      display: flex;
      gap: 9px;
    }

    .add-file {
      flex: 0 0 auto;

      padding: 10px 15px;

      border: 1px dashed var(--accent);
      border-radius: 15px;

      background: var(--accent-light);
      color: var(--accent);

      font-weight: 850;
    }

    .document-tab {
      flex: 0 0 auto;

      padding: 10px 14px;

      border: 0;
      border-radius: 15px;

      background: white;
      color: var(--subtext);

      box-shadow:
        0 2px 9px rgba(0,0,0,.04);
    }

    .document-tab.active {
      background: var(--accent-soft);
      color: var(--accent);

      font-weight: 850;
    }


    /* =========================================
       빈 화면
    ========================================= */

    .empty-card {
      margin-top: 16px;
      padding: 55px 20px;

      border-radius: var(--radius-big);

      background: white;

      text-align: center;
      color: var(--subtext);
    }

    .empty-card .big {
      margin-bottom: 13px;
      font-size: 42px;
    }


    /* =========================================
       대본 제목
    ========================================= */

    .document-heading {
      margin: 18px 2px 11px;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .document-title {
      flex: 1;

      min-width: 0;

      font-size: 20px;
      font-weight: 900;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .delete-document {
      flex: 0 0 auto;

      padding: 8px 10px;

      border: 0;
      border-radius: 11px;

      background: #f2f2f6;
      color: var(--subtext);

      font-size: 12px;
    }


    /* =========================================
       사전 분석 상태
    ========================================= */

    #prefetchStatus {
      min-height: 17px;

      margin: 5px 3px 0;

      color: var(--subtext);
      font-size: 12px;
    }


    /* =========================================
       대본
    ========================================= */

    .script-card {
      padding: 8px 17px;

      border-radius: var(--radius-big);

      background: white;

      box-shadow:
        0 3px 15px rgba(0,0,0,.035);
    }

    .script-row {
      padding: 17px 2px;

      border-bottom:
        1px solid var(--border);
    }

    .script-row:last-child {
      border-bottom: 0;
    }

    .row-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .time {
      flex: 0 0 45px;

      padding-top: 5px;

      color: var(--accent);

      font-size: 13px;
      font-weight: 850;
    }

    .chinese {
      flex: 1;

      font-size: 20px;
      line-height: 1.8;

      letter-spacing: .15px;
    }

    .word {
      display: inline;

      padding: 2px 2px;

      border-radius: 7px;

      transition: .15s;
    }

    .word:active {
      background: var(--accent-soft);
    }

    .word.learned {
      opacity: .32;
    }

    .row-actions {
      margin:
        9px 0 0 55px;

      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .small-action {
      padding: 7px 10px;

      border: 0;
      border-radius: 11px;

      background: #f3f3f7;
      color: #666672;

      font-size: 12px;
    }

    .sentence-translation {
      margin:
        10px 0 0 55px;

      padding: 11px 13px;

      border-radius: 12px;

      background: var(--accent-light);

      font-size: 14px;
      line-height: 1.6;
    }


    /* =========================================
       단어장
    ========================================= */

    .vocab-group {
      margin-bottom: 25px;
    }

    .vocab-group-title {
      margin: 3px 2px 10px;

      font-size: 17px;
      font-weight: 900;
    }

    .vocab-card {
      margin-bottom: 9px;
      padding: 16px;

      border-radius: var(--radius);

      background: white;
    }

    .vocab-card.learned-card {
      opacity: .62;
    }

    .vocab-word-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .vocab-word {
      font-size: 21px;
      font-weight: 900;
    }

    .vocab-pinyin {
      color: var(--accent);

      font-size: 14px;
      font-weight: 700;
    }

    .vocab-meaning {
      margin-top: 5px;

      font-size: 15px;
      line-height: 1.5;
    }

    .vocab-source {
      margin-top: 11px;

      color: var(--subtext);

      font-size: 12px;
      line-height: 1.55;
    }

    .vocab-actions {
      margin-top: 11px;

      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .remove-vocab {
      color: var(--danger);
    }


    /* =========================================
       분석 패널
    ========================================= */

    #panelBackdrop {
      position: fixed;
      inset: 0;
      z-index: 90;

      background:
        rgba(0,0,0,.18);
    }

    #analysisPanel {
      position: fixed;
      z-index: 100;

      background: white;

      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .panel-inner {
      padding:
        22px
        20px
        max(35px, env(safe-area-inset-bottom));
    }

    .panel-handle {
      width: 45px;
      height: 5px;

      margin: 0 auto 17px;

      border-radius: 10px;

      background: #d7d7df;
    }

    .panel-close {
      float: right;

      width: 35px;
      height: 35px;

      border: 0;
      border-radius: 50%;

      background: #f2f2f6;
    }

    .analysis-word {
      padding-right: 45px;

      font-size: 29px;
      font-weight: 900;
    }

    #analysisLoading {
      padding: 35px 0;

      color: var(--subtext);
      text-align: center;
    }

    .reading-block {
      margin-top: 12px;
      padding: 13px 15px;

      border-radius: 15px;

      background: var(--accent-light);
    }

    .reading-pinyin {
      color: var(--accent);

      font-size: 16px;
      font-weight: 850;
    }

    .reading-meaning {
      margin-top: 5px;

      line-height: 1.55;
    }

    .reading-usage {
      margin-top: 6px;

      color: var(--subtext);

      font-size: 13px;
      line-height: 1.5;
    }

    .analysis-actions {
      margin: 17px 0;

      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .analysis-action {
      padding: 10px 12px;

      border: 0;
      border-radius: 13px;

      background: #f1f1f5;

      font-weight: 750;
    }

    .analysis-action.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .analysis-section {
      margin-top: 12px;
      padding: 15px;

      border-radius: 17px;

      background: #f8f8fb;
    }

    .analysis-section h3 {
      margin: 0 0 9px;

      font-size: 14px;
    }

    .analysis-section p {
      margin: 0;

      font-size: 14px;
      line-height: 1.65;
    }

    .analysis-item {
      padding: 7px 0;

      border-bottom:
        1px solid #e9e9ee;

      font-size: 14px;
      line-height: 1.55;
    }

    .analysis-item:last-child {
      border-bottom: 0;
    }

    .hanja-char {
      margin-right: 7px;

      font-size: 19px;
      font-weight: 900;
    }


    /* =========================================
       설정창
    ========================================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 160;

      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(0,0,0,.25);
    }

    .modal-box {
      width: min(400px, 100%);

      padding: 22px;

      border-radius: 25px;

      background: white;
    }

    .modal-title {
      margin-bottom: 18px;

      font-size: 18px;
      font-weight: 900;
    }

    .setting-label {
      margin: 18px 0 9px;

      color: var(--subtext);
      font-size: 13px;
      font-weight: 750;
    }

    .theme-options {
      display: grid;
      grid-template-columns:
        repeat(5,1fr);

      gap: 12px;
    }

    .theme-dot {
      aspect-ratio: 1;

      border: 4px solid white;
      border-radius: 50%;

      box-shadow:
        0 0 0 1px #ddd;
    }

    .custom-color {
      width: 100%;
      height: 45px;

      border: 0;

      background: transparent;
    }

    .rate-options {
      display: flex;
      gap: 8px;
    }

    .rate-button {
      flex: 1;

      padding: 11px;

      border: 0;
      border-radius: 13px;

      background: #f1f1f5;

      font-weight: 800;
    }

    .rate-button.active {
      background: var(--accent);
      color: white;
    }

    .modal-close-button {
      width: 100%;

      margin-top: 20px;
      padding: 12px;

      border: 0;
      border-radius: 14px;

      background: #f1f1f5;

      font-weight: 800;
    }


    /* =========================================
       토스트
    ========================================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom:
        max(30px, env(safe-area-inset-bottom));
      z-index: 300;

      max-width:
        calc(100% - 32px);

      padding: 12px 17px;

      border-radius: 14px;

      background: #26262d;
      color: white;

      font-size: 13px;
      text-align: center;

      opacity: 0;
      pointer-events: none;

      transform:
        translateX(-50%)
        translateY(20px);

      transition: .22s;
    }

    #toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================================
       모바일
    ========================================= */

    @media (max-width: 760px) {

      #analysisPanel {
        left: 0;
        right: 0;
        bottom: 0;

        height: 70vh;

        border-radius:
          28px 28px 0 0;
      }

    }


    /* =========================================
       데스크톱
    ========================================= */

    @media (min-width: 761px) {

      #analysisPanel {
        top: 0;
        right: 0;
        bottom: 0;

        width:
          min(410px, 34vw);

        box-shadow:
          -8px 0 30px
          rgba(0,0,0,.08);
      }

      .panel-handle {
        display: none;
      }

      body.panel-open .app-header,
      body.panel-open .page {
        margin-right:
          min(410px, 34vw);
      }

      #panelBackdrop {
        display: none !important;
      }

    }

  </style>
</head>


<body>


<!-- ========================================================
     로그인 / 회원가입
======================================================== -->

<section id="authScreen">

  <div class="auth-card">

    <div class="auth-logo">
      日本語
    </div>

    <h1>
      일본어 공부
    </h1>

    <div class="auth-desc">
      로그인하면 대본과 단어장이 자동으로 저장돼요.<br>
      휴대폰·태블릿·PC 어디서든 이어서 공부할 수 있어요.
    </div>

    <div class="auth-field">

      <label>
        이메일
      </label>

      <input
        id="emailInput"
        type="email"
        autocomplete="email"
        placeholder="example@email.com"
      >

    </div>


    <div class="auth-field">

      <label>
        비밀번호
      </label>

      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        placeholder="6자 이상"
      >

    </div>


    <button
      id="authSubmit"
      class="main-auth-button"
      onclick="submitAuth()"
    >
      로그인
    </button>


    <div class="switch-auth">

      <span id="authSwitchText">
        처음이신가요?
      </span>

      <button
        id="authSwitchButton"
        onclick="toggleAuthMode()"
      >
        회원가입
      </button>

    </div>


    <div id="authMessage"></div>

  </div>

</section>



<!-- ========================================================
     메인 앱
======================================================== -->

<section
  id="app"
  class="hidden"
>

  <header class="app-header">

    <div class="header-row">

      <div class="app-title">
        日本語 일본어 공부
      </div>

      <button
        class="round-button"
        onclick="openSettings()"
        title="설정"
      >
        🎨
      </button>

      <button
        class="round-button"
        onclick="logout()"
        title="로그아웃"
      >
        ↪
      </button>

    </div>


    <div class="main-tabs">

      <button
        id="scriptMainTab"
        class="main-tab active"
        onclick="showMainView('scripts')"
      >
        📖 대본
      </button>

      <button
        id="vocabMainTab"
        class="main-tab"
        onclick="showMainView('vocab')"
      >
        ⭐ 단어장
      </button>

    </div>

  </header>



  <!-- ======================================================
       대본
  ======================================================= -->

  <main
    id="scriptsView"
    class="page"
  >

    <div class="document-toolbar">

      <button
        class="add-file"
        onclick="
          document
            .getElementById('fileInput')
            .click()
        "
      >
        ＋ 파일 추가
      </button>

      <input
        id="fileInput"
        type="file"
        accept=".pdf,image/*"
        multiple
        hidden
      >

      <div id="documentTabs"></div>

    </div>


    <div id="prefetchStatus"></div>


    <div
      id="emptyDocuments"
      class="empty-card"
    >

      <div class="big">
        📄
      </div>

      <strong>
        공부할 대본을 추가해 주세요.
      </strong>

      <div
        style="
          margin-top:8px;
          font-size:14px;
        "
      >
        PDF 또는 이미지에서 일본어 대사를 추출해 저장해요.
      </div>

    </div>


    <div
      id="documentContent"
      class="hidden"
    >

      <div class="document-heading">

        <div
          id="documentTitle"
          class="document-title"
        ></div>

        <button
          class="delete-document"
          onclick="deleteCurrentDocument()"
        >
          대본 삭제
        </button>

      </div>

      <div
        id="scriptRows"
        class="script-card"
      ></div>

    </div>

  </main>



  <!-- ======================================================
       단어장
  ======================================================= -->

  <main
    id="vocabView"
    class="page hidden"
  >

    <div id="vocabContent"></div>

  </main>

</section>



<!-- ========================================================
     분석창
======================================================== -->

<div
  id="panelBackdrop"
  class="hidden"
  onclick="closeAnalysis()"
></div>


<aside
  id="analysisPanel"
  class="hidden"
>

  <div class="panel-inner">

    <div class="panel-handle"></div>

    <button
      class="panel-close"
      onclick="closeAnalysis()"
    >
      ×
    </button>


    <div
      id="analysisWord"
      class="analysis-word"
    ></div>


    <div
      id="analysisLoading"
      class="hidden"
    >
      단어를 불러오는 중…
    </div>


    <div id="analysisContent"></div>

  </div>

</aside>



<!-- ========================================================
     설정창
======================================================== -->

<div
  id="settingsModal"
  class="modal hidden"
  onclick="closeSettings(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div class="modal-title">
      🎨 공부 설정
    </div>


    <div class="setting-label">
      테마 색상
    </div>


    <div class="theme-options">

      <button
        class="theme-dot"
        style="background:#8b7cf6"
        onclick="setTheme('#8b7cf6')"
        title="라벤더"
      ></button>

      <button
        class="theme-dot"
        style="background:#ec8fa9"
        onclick="setTheme('#ec8fa9')"
        title="핑크"
      ></button>

      <button
        class="theme-dot"
        style="background:#65bfa5"
        onclick="setTheme('#65bfa5')"
        title="민트"
      ></button>

      <button
        class="theme-dot"
        style="background:#659bd8"
        onclick="setTheme('#659bd8')"
        title="블루"
      ></button>

      <button

/* ==========================================================
   8. PDF 텍스트 추출
========================================================== */

async function extractPDF(
  file
) {

  const arrayBuffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjsLib
      .getDocument({
        data:
          arrayBuffer
      })
      .promise;


  const allRows = [];


  for (
    let pageNumber = 1;
    pageNumber <=
      pdf.numPages;
    pageNumber++
  ) {

    const page =
      await pdf.getPage(
        pageNumber
      );


    const textContent =
      await page
        .getTextContent();


    const lines =
      extractPageLines(
        textContent.items
      );


    const rows =
      buildJapaneseRows(
        lines
      );


    allRows.push(
      ...rows
    );

  }


  return allRows;

}



function extractPageLines(
  items
) {

  const groups = [];


  for (
    const item
    of items
  ) {

    const text =
      String(
        item.str || ""
      )
        .trim();


    if (!text) {
      continue;
    }


    const x =
      item.transform?.[4] ||
      0;


    const y =
      item.transform?.[5] ||
      0;


    let group =
      groups.find(
        g =>
          Math.abs(
            g.y - y
          ) < 3
      );


    if (!group) {

      group = {
        y,
        items: []
      };


      groups.push(
        group
      );

    }


    group.items.push({
      x,
      text
    });

  }


  groups.sort(
    (a,b) =>
      b.y - a.y
  );


  return groups.map(
    group => {

      group.items.sort(
        (a,b) =>
          a.x - b.x
      );


      return group.items
  .map(item => item.text)
  .join("")
  .replace(
    /([\u3400-\u9FFF])\s+(?=[\u3400-\u9FFF])/g,
    "$1"
  )
  .replace(/\s+/g, " ")
  .trim();

    }
  );

}

async function extractImage(
  file
) {

  toast(

  const result =

      .split(
        /\r?\n/
      )
      .map(
        line =>
          line.trim()
      )
      .filter(
        Boolean
      );


  return buildJapaneseRows(
    lines
  );

}



/* ==========================================================
   10. 시간 + 일본어 대본 생성
========================================================== */

function findTime(
  text
) {

  const match =
    String(text)
      .match(
        /\b\d{1,2}:\d{2}\b/
      );


  return match
    ? match[0]
    : null;

}



function hasJapanese(
  text
) {

  return /[\u3040-\u30ff\u3400-\u9fff]/.test(
    String(text)
  );

}



function buildJapaneseRows(lines) {
  const rows = [];
  let pendingTime = "";

  for (const original of lines) {
    let line = String(original || "").trim();

    if (!line) continue;

    // 시간이 있으면 기억해 둠
    const time = findTime(line);
    if (time) {
      pendingTime = time;
    }

    // 시간 표시는 일본어 문장에서 제거
    line = line
      .replace(/\d{1,2}:\d{2}/g, "")
      .trim();

    // 일본어가 없는 줄은 대본으로 만들지 않음
    if (!hasJapanese(line)) {
      continue;
    }

    // 일본어 대사 안에 PDF/OCR이 만든 가짜 공백 정리
line = line.replace(/\s+/g, " ").trim();

    if (!line) continue;

    rows.push({
      time: pendingTime || "",
      chinese: line
    });

    // 시간은 바로 다음 일본어 문장에만 사용
    pendingTime = "";
  }

  return rows;
}

      new Intl.Segmenter(
        "ja",
        {
          granularity:
            "word"
        }
      );


    return [
      ...segmenter.segment(
        sentence
      )
    ]
      .map(
        item => ({

          text:
            item.segment,

          isWord:
            item.isWordLike !== false &&
            hasJapanese(
              item.segment
            )

        })
      );


  } catch (error) {

    /* Segmenter 미지원 브라우저 */

    return [
      ...String(sentence)
    ]
      .map(
        char => ({

          text:
            char,

          isWord:
            hasJapanese(
              char
            )

        })
      );

  }

}



/* ==========================================================
   15. 대본 속 클릭 가능한 단어
========================================================== */

function renderSegmentedSentence(
  container,
  sentence,
  doc
) {

  const segments =
    segmentJapanese(
      sentence
    );


  for (
    const segment
    of segments
  ) {

    if (
      !segment.isWord
    ) {

      container.appendChild(
        document.createTextNode(
          segment.text
        )
      );


      continue;

    }


    const span =
      document.createElement(
        "span"
      );


    span.className =
      "word";


    if (
      learnedWords.has(
        segment.text
      )
    ) {

      span.classList.add(
        "learned"
      );

    }


    span.textContent =
      segment.text;


    span.onclick =
      event => {

        event.stopPropagation();


        selectWord(
          segment.text,
          sentence,
          doc
        );

      };


    container.appendChild(
      span
    );

  }

}

   17. 단어 분석 요청
========================================================== */

async function getWordAnalysis(
  word
) {

  /* 같은 화면에서 이미 불러온 단어 */
  if (
    analysisMemory.has(
      word
    )
  ) {

    return analysisMemory.get(
      word
    );

  }


  /* 서버의 japanese-api가 먼저 word_cache를 확인.
     캐시에 있으면 AI를 호출하지 않음. */

  const {
    data,
    error
  } =
    await sb.functions.invoke(
      "japanese-api",
      {

        body: {

          type:
            "word",

          word:
            word

        }

      }
    );


  if (error) {
    throw error;
  }


  if (
    !data?.analysis
  ) {

    throw new Error(
      "단어 분석 결과가 없습니다."
    );

  }


  analysisMemory.set(
    word,
    data.analysis
  );


  return data.analysis;

}

/* ==========================================================
   19. 단어장 저장
========================================================== */

async function saveVocabulary(
  analysis
) {

  if (
    !currentUser ||
    !selectedWord ||
    !selectedDocument
  ) {

    return;

  }


  const word =
    selectedWord;


  /* 이미 저장된 경우
     최초 저장 파일을 알려줌 */

  const existing =
    vocabulary.find(
      item =>
        item.word ===
        word
    );


  if (existing) {

    toast(
      `‘${cleanFileName(
        existing.source_file_name
      )}’ 단어장에 이미 저장된 단어예요!`
    );


    return;

  }


  const pinyin =
    [
      analysis.reading || "",
      analysis.romaji || ""
    ]
      .filter(Boolean)
      .join(" · ");


  const meaning =
    Array.isArray(
      analysis.meanings
    )

      ? analysis.meanings
          .join(", ")

      : "";


  const {
    data,
    error
  } =
    await sb
      .from(
        "vocabulary"
      )
      .insert({

        user_id:
          currentUser.id,

        language: "ja",

        word,

        pinyin,

        meaning,

        source_document_id:
          selectedDocument.id,

        source_file_name:
          selectedDocument.file_name,

        source_sentence:
          selectedSentence

      })
      .select()
      .single();


  if (error) {

    /* DB unique(user_id,word)가
       동시에 중복 저장되는 것도 막음 */

    if (
      String(
        error.code
      ) === "23505"
    ) {

      await refreshVocabulary();


      const found =
        vocabulary.find(
          item =>
            item.word ===
            word
        );


      if (found) {

        toast(
          `‘${cleanFileName(
            found.source_file_name
          )}’ 단어장에 이미 저장된 단어예요!`
        );

      } else {

        toast(
          "이미 저장된 단어예요!"
        );

      }


      return;

    }


    console.error(
      error
    );


    toast(
      "단어장에 저장하지 못했어요."
    );


    return;

  }


  vocabulary.push(
    data
  );


  toast(
    "단어장에 저장했어요 ⭐"
  );


  renderVocabulary();


  if (
    selectedWord ===
    word
  ) {

    renderAnalysis(
      analysis
    );

  }

}



async function refreshVocabulary() {

  const {
    data,
    error
  } =
    await sb
      .from(
        "vocabulary"
      )
      .select("*")
      .eq("language", "ja")
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      error
    );

    return;

  }


  vocabulary =
    data || [];

}

async function removeVocabulary(
  id,
  word
) {

  const ok =
    confirm(
      `‘${word}’을 단어장에서 삭제할까요?`
    );


  if (!ok) {
    return;
  }


  const {
    error
  } =
    await sb
      .from(
        "vocabulary"
      )
      .delete()
      .eq(

      );


  if (error) {

    );


    toast(

    );


    return;

  }


  vocabulary =

    );


  renderVocabulary();


  toast(
    "단어장에서 삭제했어요."
  );

   21. 외운 단어
========================================================== */

async function toggleLearned(
  word
) {

  if (
    !currentUser ||
    !word
  ) {

    return;

  }


  if (
    learnedWords.has(
      word
    )
  ) {

    const {
      error
    } =
      await sb
        .from(
          "learned_words"
        )
        .delete()
        .eq("language", "ja")
        .eq(
          "word",
          word
        );


    if (error) {

      console.error(
        error
      );


      toast(
        "외움 표시를 변경하지 못했어요."
      );


      return;

    }


    learnedWords.delete(
      word
    );


    toast(
      "외움 표시를 해제했어요."
    );


  } else {

    const {
      error
    } =
      await sb
        .from(
          "learned_words"
        )
        .insert({

          user_id:
            currentUser.id,

          language: "ja",

          word

        });


    if (error) {

      console.error(
        error
      );


      toast(
        "외움 표시를 변경하지 못했어요."
      );


      return;

    }


    learnedWords.add(
      word
    );


    toast(
      "외운 단어로 표시했어요 ✓"
    );

  }


  /* 모든 대본에서 같은 단어 흐리게 */
  renderCurrentDocument();


  renderVocabulary();

}

/* ==========================================================
   24. PDF 업로드 후 단어 미리 분석
========================================================== */

async function prefetchDocument(doc) {
  const words = new Set();

  const rows = Array.isArray(doc.rows)
    ? doc.rows
    : [];

  rows.forEach(row => {
    segmentJapanese(row.chinese)
      .filter(item => item.isWord)
      .forEach(item => {
        words.add(item.text);
      });
  });

  const list = [...words];

  if (!list.length) return;

  const status =
    document.getElementById("prefetchStatus");

  const BATCH_SIZE = 30;
  let finished = 0;

  status.textContent =
    `단어 준비 중 · 1~${Math.min(30, list.length)}`;

  /*
    앞에서부터 30개씩 준비한다.
    한 묶음이 끝나면 다음 30개로 넘어감.

    각 묶음 안에서는 동시에 너무 많은 요청을
    보내지 않도록 worker 2개만 사용한다.
  */
  for (
    let start = 0;
    start < list.length;
    start += BATCH_SIZE
  ) {
    const batch =
      list.slice(
        start,
        start + BATCH_SIZE
      );

    const queue = [...batch];

    const batchStart = start + 1;
    const batchEnd =
      Math.min(
        start + BATCH_SIZE,
        list.length
      );

    status.textContent =
      `단어 준비 중 · ${batchStart}~${batchEnd}`;

    async function worker() {
      while (queue.length) {
        const word = queue.shift();

        try {
          await getWordAnalysis(word);
        } catch (error) {
          console.warn(
            "단어 미리 분석 실패",
            word,
            error
          );
        } finally {
          finished++;
        }
      }
    }

    await Promise.all([
      worker(),
      worker()
    ]);

    /*
      다음 30개로 넘어가기 전에
      아주 잠깐 브라우저에 여유를 줌
    */
    await new Promise(resolve =>
      setTimeout(resolve, 150)
    );
  }

  status.textContent =
    `단어 준비 완료 ✓`;

  setTimeout(() => {
    if (
      status.textContent.startsWith(
        "단어 준비 완료"
      )
    ) {
      status.textContent = "";
    }
  }, 3500);
}



/* ==========================================================
   25. 일본어 음성
========================================================== */

function speakJapanese(
  text
) {

  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    toast(
      "이 브라우저에서는 음성을 사용할 수 없어요."
    );


    return;

  }


  window
    .speechSynthesis
    .cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "ja-JP";


  utterance.rate =
    speechRate;


  const voices =
    window
      .speechSynthesis
      .getVoices();


  const japaneseVoice =
    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(
            "ja-jp"
          )
    )
    ||
    voices.find(
      voice =>
        voice.lang
          .toLowerCase()
          .startsWith(
            "ja"
          )
    );


  if (
    japaneseVoice
  ) {

    utterance.voice =
      japaneseVoice;

  }


  window
    .speechSynthesis
    .speak(
      utterance
    );

}



/* ==========================================================
   26. 설정창
========================================================== */

function openSettings() {

  updateSettingsUI();


  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "hidden"
    );

}



function closeSettings(
  event
) {

  if (
    event &&
    event.target.id !==
      "settingsModal"
  ) {

    return;

  }


  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "hidden"
    );

}



/* ==========================================================
   27. 테마
========================================================== */

async function setTheme(
  color
) {

  themeColor =
    color;


  applyTheme(
    color
  );


  document
    .getElementById(
      "customColor"
    )
    .value =
      color;


  await saveSettings();


  toast(
    "테마 색상을 저장했어요."
  );

}



function applyTheme(
  color
) {

  const root =
    document.documentElement;


  root.style.setProperty(
    "--accent",
    color
  );


  root.style.setProperty(
    "--accent-soft",
    hexToRgba(
      color,
      .14
    )
  );


  root.style.setProperty(
    "--accent-light",
    hexToRgba(
      color,
      .07
    )
  );

}



/* ==========================================================
   28. 음성 속도
========================================================== */

async function setSpeechRate(
  rate
) {

  speechRate =
    Number(rate);


  updateSettingsUI();


  await saveSettings();


  /* 현재 열려 있는 대본/단어장 버튼도 갱신 */
  renderCurrentDocument();

  renderVocabulary();


  toast(
    speechRate === 0.7
      ? "음성을 0.7×로 설정했어요."
      : "음성을 1×로 설정했어요."
  );

}



function updateSettingsUI() {

  const slow =
    document.getElementById(
      "rate07"
    );


  const normal =
    document.getElementById(
      "rate10"
    );


  if (
    !slow ||
    !normal
  ) {

    return;

  }


  slow.classList.toggle(
    "active",
    speechRate === 0.7
  );


  normal.classList.toggle(
    "active",
    speechRate !== 0.7
  );


  const colorInput =
    document.getElementById(
      "customColor"
    );


  if (
    colorInput &&
    /^#[0-9a-f]{6}$/i.test(
      themeColor
    )
  ) {

    colorInput.value =
      themeColor;

  }

}



/* ==========================================================
   29. 설정 Supabase 저장
========================================================== */

async function saveSettings() {

  if (
    !currentUser
  ) {

    return;

  }


  const {
    error
  } =
    await sb
      .from(
        "user_settings"
      )
      .upsert(
        {

          user_id:
            currentUser.id,

          theme_color:
            themeColor,

          speech_rate:
            speechRate,

          updated_at:
            new Date()
              .toISOString()

        },
        {

          onConflict:
            "user_id"

        }
      );


  if (
    error
  ) {

    console.error(
      "settings error",
      error
    );


    toast(
      "설정을 저장하지 못했어요."
    );

  }

}



/* ==========================================================
   30. 색상 변환
========================================================== */

function hexToRgba(
  hex,
  alpha
) {

  const clean =
    String(hex)
      .replace(
        "#",
        ""
      );


  if (
    clean.length !== 6
  ) {

    return `rgba(139,124,246,${alpha})`;

  }


  const r =
    parseInt(
      clean.substring(
        0,
        2
      ),
      16
    );


  const g =
    parseInt(
      clean.substring(
        2,
        4
      ),
      16
    );


  const b =
    parseInt(
      clean.substring(
        4,
        6
      ),
      16
    );


  return `rgba(${r},${g},${b},${alpha})`;

}



/* ==========================================================
   31. 파일명 정리
========================================================== */

function cleanFileName(
  name
) {

  return String(
    name || ""
  )
    .replace(
      /\.(pdf|png|jpg|jpeg|webp)$/i,
      ""
    );

}



/* ==========================================================
   32. HTML 안전 처리
========================================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}



/* ==========================================================
   33. 알림
========================================================== */

function toast(
  message
) {

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    message;


  element.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      2700
    );

}
